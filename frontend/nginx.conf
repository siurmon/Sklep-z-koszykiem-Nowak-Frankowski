server {
    listen 80;

    root /usr/share/nginx/html;
    index site.html;

    # API PHP jest pod /api/, a healthcheck mozna otworzyc tez w przegladarce
    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
